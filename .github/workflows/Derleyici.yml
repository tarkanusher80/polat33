# Bu araç @keyiflerolsun tarafından | @KekikAkademi için yazılmıştır.
 name: CloudStream Derleyici
 concurrency:
   group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
   cancel-in-progress: true
 
 on:
   workflow_dispatch:
   push:
     branches:
       - master
     paths-ignore:
       - "**/*.md"
       - "**/*.yml"
       - "**/*.jpg"
       - "**/*.png"
       - "**/*.py"
 
 jobs:
  CloudStreamDerleyici:
    runs-on: ubuntu-latest
    steps:
       - name: "'src' Depo Kontrolü"
         uses: actions/checkout@v6
         with:
           path: "src"
 
       - name: "'build' Depo Kontrolü"
         uses: actions/checkout@v6
         with:
           ref: "builds"
           path: "builds"
 
       - name: Eski Derlemeleri Temizle
         run: rm $GITHUB_WORKSPACE/builds/*.cs3 || true
 
       - name: JDK 17 Ayarla
         uses: actions/setup-java@v5
         with:
           distribution: temurin
           java-version: 17

       - name: Setup Gradle
         uses: gradle/actions/setup-gradle@v5
         with:
           cache-read-only: false
 
       - name: Eklentileri Derle
         run: |
           cd $GITHUB_WORKSPACE/src
           chmod +x gradlew
           ./gradlew make makePluginsJson
           cp **/build/*.cs3 $GITHUB_WORKSPACE/builds
           cp build/plugins.json $GITHUB_WORKSPACE/builds
       - name: Cs3 Dosyasını Artifact Olarak Yükle
         uses: actions/upload-artifact@v4
         with:
        name: FilmKovasi-cs3
        path: ${{ github.workspace }}/builds/*.cs3
